<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call It - Card Game</title>
  <!-- Load p5.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #111;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>

<script>
// Card Class representing individual playing cards
class Card {
  constructor(s, v) {
    this.suit = s; // 0: Hearts, 1: Diamonds, 2: Clubs, 3: Spades
    this.value = v; // 1 to 13
  }

  getRankStr() {
    if (this.value === 1) return "A";
    if (this.value === 11) return "J";
    if (this.value === 12) return "Q";
    if (this.value === 13) return "K";
    return String(this.value);
  }
}

// Game State Variables
let deck = [];
let deckSize = 52;
let openPile = [];
let openSize = 0;
let playerHand = [];
let playerSize = 0;
let opponentHand = [];
let opponentSize = 0;

let playerScore = 0;
let opponentScore = 0;
let selectedCardIndex = -1;
let statusMessage = "Click deck to draw, or select a card.";

let isPlayerTurn = true;
let roundStartedByPlayer = true;

let knownPlayerCardValue = null;

let waitingForAI = false;
let aiTurnTime = 0;

let animatingPlay = false;
let animStartTime = 0;
let animCards = [];
let animCardCount = 0;
let pendingAITurn = false;

let callItGameOverPaused = false;
let revealOpponentCards = false;

// Dynamic coordinate calculation variables
let CARD_W = 110;
let CARD_H = 150;
let OPP_CARD_W = 90;
let OPP_CARD_H = 130;
let CARD_GAP = 120;
let OPP_CARD_GAP = 100;

function setup() {
  createCanvas(windowWidth, windowHeight);
  textAlign(CENTER, CENTER);
  roundStartedByPlayer = Math.random() >= 0.5;
  isPlayerTurn = roundStartedByPlayer;
  initGame();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function initGame() {
  deck = [];
  for (let s = 0; s < 4; s++) {
    for (let v = 1; v <= 13; v++) {
      deck.push(new Card(s, v));
    }
  }
  // Shuffle Deck
  for (let i = deck.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    let temp = deck[i];
    deck[i] = deck[j];
    deck[j] = temp;
  }
  deckSize = deck.length;

  playerHand = [];
  opponentHand = [];
  playerSize = 0;
  opponentSize = 0;
  
  // Deal initial hands
  for (let i = 0; i < 5; i++) {
    playerHand.push(deck.pop());
    playerSize++;
    opponentHand.push(deck.pop());
    opponentSize++;
    deckSize -= 2;
  }

  openPile = [deck.pop()];
  openSize = 1;
  deckSize--;

  selectedCardIndex = -1;
  waitingForAI = false;
  animatingPlay = false;
  callItGameOverPaused = false;
  revealOpponentCards = false;
  knownPlayerCardValue = null;

  isPlayerTurn = roundStartedByPlayer;
  if (!isPlayerTurn) {
    statusMessage = "Opponent's turn. Thinking...";
    startAITurn();
  } else {
    statusMessage = "Your turn. Click deck or select cards.";
  }
}

function draw() {
  background(40, 120, 60);

  // Scaled dynamic reference frame based on 1920x1080 design space
  let sx = width / 1920;
  let sy = height / 1080;

  push();
  scale(sx, sy);

  // Modal screen overlay when round or match completes
  if (callItGameOverPaused) {
    drawGameElements();
    fill(0, 0, 0, 160);
    rect(0, 0, 1920, 1080);

    let matchOver = (playerScore >= 100 || opponentScore >= 100);

    if (matchOver) {
      fill(255);
      textSize(48);
      let outcomeText = (playerScore >= 100) ? "You lost!" : "You won!";
      text(outcomeText, 1920 / 2, 1080 / 2 - 90);
    }

    // Continue / Restart Button
    fill(200, 150, 0);
    stroke(255);
    strokeWeight(2);
    rect(1920 / 2 - 150, 1080 / 2 - 40, 300, 80, 12);
    fill(255);
    noStroke();
    textSize(28);
    text("Continue", 1920 / 2, 1080 / 2);
    pop();
    return;
  }

  // Handle animation timer for playing cards
  if (animatingPlay && millis() - animStartTime >= 1800) {
    animatingPlay = false;
    for (let i = 0; i < animCardCount; i++) {
      openPile.push(animCards[i]);
      openSize++;
    }
    animCardCount = 0;
    
    if (pendingAITurn) {
      pendingAITurn = false;
      isPlayerTurn = false;
      waitingForAI = true;
      aiTurnTime = millis() + 1500;
    }
  }

  // Handle AI turn execution delay
  if (waitingForAI && millis() >= aiTurnTime) {
    executeAITurn();
    waitingForAI = false;
  }

  drawGameElements();
  pop();
}

function drawGameElements() {
  let centerX = 1920 / 2;

  // --- Header HUD (Centered Scoreboard) ---
  fill(0, 0, 0, 100);
  noStroke();
  rect(centerX - 350, 20, 700, 80, 12);

  fill(255);
  textSize(22);
  textAlign(CENTER, CENTER);
  text("You: " + playerScore + "   |   Opponent: " + opponentScore, centerX, 45);
  textSize(18);
  fill(isPlayerTurn ? color(120, 255, 120) : color(255, 200, 120));
  text("Current Turn: " + (isPlayerTurn ? "You" : "Opponent"), centerX, 75);

  // --- Opponent Hand Box (Narrower container snug to cards) ---
  let oppCardGap = 105;
  let oppBoxWidth = Math.max(opponentSize, 1) * oppCardGap + 50;
  let oppBoxHeight = 160;
  let oppBoxX = centerX - oppBoxWidth / 2;
  let oppBoxY = 115;

  fill(200, 50, 50, 220);
  noStroke();
  rect(oppBoxX, oppBoxY, oppBoxWidth, oppBoxHeight, 12);
  
  fill(255);
  textSize(18);
  text("Opponent's Hand (" + opponentSize + " cards)", centerX, oppBoxY + 25);

  let oppStartX = centerX - ((opponentSize - 1) * oppCardGap) / 2 - 45;
  for (let i = 0; i < opponentSize; i++) {
    let cx = oppStartX + i * oppCardGap;
    let cy = oppBoxY + 45;
    if (revealOpponentCards) {
      drawCard(cx, cy, 90, 105, opponentHand[i], false);
    } else {
      fill(120, 25, 25);
      stroke(255);
      strokeWeight(1.5);
      rect(cx, cy, 90, 105, 8);
      fill(255);
      noStroke();
      textSize(26);
      text("?", cx + 45, cy + 52.5);
    }
  }

  // --- Deck & Open Pile (Closer Together in Center) ---
  let deckX = centerX - 120;
  let openX = centerX + 10;
  let centerPilesY = 430;
  let centerCardW = 110;
  let centerCardH = 150;

  // Draw Deck
  fill(60, 60, 70);
  stroke(220);
  strokeWeight(2);
  rect(deckX, centerPilesY, centerCardW, centerCardH, 10);
  noStroke();
  fill(255);
  textSize(18);
  text("Deck\n(" + deckSize + ")", deckX + centerCardW / 2, centerPilesY + centerCardH / 2);

  // Draw Open Pile
  if (openSize > 0) {
    drawCard(openX, centerPilesY, centerCardW, centerCardH, openPile[openSize - 1], false);
  } else {
    fill(0, 0, 0, 40);
    stroke(255, 100);
    rect(openX, centerPilesY, centerCardW, centerCardH, 10);
    noStroke();
  }

  // Draw Card Play Animations
  if (animatingPlay) {
    for (let i = 0; i < animCardCount; i++) {
      drawCard(centerX + 140 + i * 120, centerPilesY, centerCardW, centerCardH, animCards[i], false);
    }
  }

  // --- Player Hand Box (Narrower container snug to 5 cards max) ---
  let playerCardGap = 130;
  let playerBoxWidth = Math.max(playerSize, 1) * playerCardGap + 60;
  let playerBoxHeight = 220;
  let playerBoxX = centerX - playerBoxWidth / 2;
  let playerBoxY = 720;

  fill(40, 80, 150, 220);
  noStroke();
  rect(playerBoxX, playerBoxY, playerBoxWidth, playerBoxHeight, 12);
  
  fill(255);
  textSize(20);
  text("Your Hand", centerX, playerBoxY + 28);

  let playerStartX = centerX - ((playerSize - 1) * playerCardGap) / 2 - 55;
  for (let i = 0; i < playerSize; i++) {
    let x = playerStartX + i * playerCardGap;
    let y = playerBoxY + 50;
    let isSelected = (selectedCardIndex === i);
    if (isSelected) y -= 25;
    drawCard(x, y, 110, 150, playerHand[i], isSelected);
  }

  // --- Status Message (Centered below hand) ---
  fill(255);
  textSize(20);
  textAlign(CENTER, CENTER);
  text(statusMessage, centerX, 965);

  // --- Call It Button & Version Tag (Dynamically Centered Bottom Bar) ---
  let canCall = (playerSize === 1 && playerHand[0].value <= 5);
  let btnW = 180;
  let btnH = 50;
  let btnX = centerX - btnW / 2;
  let btnY = 1005;

  fill(canCall ? color(220, 160, 0) : color(80, 80, 80, 180));
  stroke(canCall ? color(255) : color(120));
  strokeWeight(2);
  rect(btnX, btnY, btnW, btnH, 10);
  
  fill(canCall ? color(255) : color(170));
  noStroke();
  textSize(22);
  text("Call It", centerX, btnY + btnH / 2);

  // Version Text - Centered Bottom
  fill(200, 200, 200, 180);
  textSize(14);
  text("v1.5.0", centerX, 1065);
}

// Card Renderer Helper
function drawCard(x, y, w, h, c, isSelected) {
  if (isSelected) {
    fill(255, 230, 0);
    rect(x - 4, y - 4, w + 8, h + 8, 10);
  }
  
  fill(255);
  stroke(30);
  strokeWeight(1.5);
  rect(x, y, w, h, 8);

  let isRed = (c.suit === 0 || c.suit === 1);
  fill(isRed ? color(210, 30, 30) : color(20, 20, 20));
  textSize(w * 0.22);
  textAlign(LEFT, TOP);
  text(c.getRankStr(), x + 7, y + 6);

  drawSuitSymbol(x + w / 2, y + h / 2, w * 0.35, c.suit);
  textAlign(CENTER, CENTER);
  noStroke();
}

// Vector Suit Icon Generator
function drawSuitSymbol(cx, cy, sz, suit) {
  noStroke();
  let isRed = (suit === 0 || suit === 1);
  fill(isRed ? color(210, 30, 30) : color(20, 20, 20));

  if (suit === 0) { // Heart
    ellipse(cx - sz * 0.22, cy - sz * 0.1, sz * 0.45, sz * 0.45);
    ellipse(cx + sz * 0.22, cy - sz * 0.1, sz * 0.45, sz * 0.45);
    triangle(cx - sz * 0.44, cy, cx + sz * 0.44, cy, cx, cy + sz * 0.5);
  } else if (suit === 1) { // Diamond
    quad(cx, cy - sz * 0.5, cx + sz * 0.35, cy, cx, cy + sz * 0.5, cx - sz * 0.35, cy);
  } else if (suit === 2) { // Club
    ellipse(cx, cy - sz * 0.2, sz * 0.35, sz * 0.35);
    ellipse(cx - sz * 0.22, cy + sz * 0.15, sz * 0.35, sz * 0.35);
    ellipse(cx + sz * 0.22, cy + sz * 0.15, sz * 0.35, sz * 0.35);
    rect(cx - sz * 0.08, cy, sz * 0.16, sz * 0.4);
  } else if (suit === 3) { // Spade
    ellipse(cx - sz * 0.22, cy + sz * 0.1, sz * 0.45, sz * 0.45);
    ellipse(cx + sz * 0.22, cy + sz * 0.1, sz * 0.45, sz * 0.45);
    triangle(cx - sz * 0.44, cy, cx + sz * 0.44, cy, cx, cy - sz * 0.5);
    rect(cx - sz * 0.08, cy, sz * 0.16, sz * 0.4);
  }
}

// Interaction handling
function mousePressed() {
  let sx = width / 1920;
  let sy = height / 1080;
  let mX = mouseX / sx;
  let mY = mouseY / sy;
  let centerX = 1920 / 2;

  // Handle click on round/game over screen
  if (callItGameOverPaused) {
    if (mX >= centerX - 150 && mX <= centerX + 150 && mY >= 1080 / 2 - 40 && mY <= 1080 / 2 + 40) {
      if (playerScore >= 100 || opponentScore >= 100) {
        playerScore = 0;
        opponentScore = 0;
        statusMessage = "New Game Started!";
      }
      roundStartedByPlayer = !roundStartedByPlayer;
      initGame();
    }
    return;
  }

  if (!isPlayerTurn || waitingForAI || animatingPlay) return;

  let deckX = centerX - 120;
  let openX = centerX + 10;
  let centerPilesY = 430;
  let centerCardW = 110;
  let centerCardH = 150;

  // Click Deck
  if (mX >= deckX && mX <= deckX + centerCardW && mY >= centerPilesY && mY <= centerPilesY + centerCardH) {
    if (selectedCardIndex !== -1 && deckSize > 0) {
      let discarded = playerHand[selectedCardIndex];
      playerHand[selectedCardIndex] = deck.pop();
      deckSize--;
      
      if (playerSize === 1) {
        knownPlayerCardValue = null;
      }

      animCards = [discarded];
      animCardCount = 1;
      animatingPlay = true;
      animStartTime = millis();
      pendingAITurn = true;
      
      selectedCardIndex = -1;
      statusMessage = "Drew card. Opponent's turn next.";
    } else {
      statusMessage = "Select a card from your hand first to discard.";
    }
  }

  // Click Open Pile
  if (mX >= openX && mX <= openX + centerCardW && mY >= centerPilesY && mY <= centerPilesY + centerCardH) {
    if (openSize > 0 && selectedCardIndex !== -1) {
      let topOpen = openPile[openSize - 1];
      let chosen = playerHand[selectedCardIndex];
      
      if (chosen.value === topOpen.value && chosen.suit === topOpen.suit) {
        statusMessage = "Cannot play the exact card just taken!";
        return;
      }

      if (playerSize === 1 && topOpen.value <= 5) {
        knownPlayerCardValue = topOpen.value;
      } else if (playerSize === 1) {
        knownPlayerCardValue = null;
      }
      
      openSize--; 
      animCards = [chosen];
      animCardCount = 1;
      animatingPlay = true;
      animStartTime = millis();
      pendingAITurn = true;
      
      playerHand[selectedCardIndex] = topOpen;
      selectedCardIndex = -1;
      statusMessage = "Took open card. Opponent's turn next.";
    } else {
      statusMessage = "Select a card from your hand to exchange.";
    }
  }

  // Click Player Hand Cards
  let playerCardGap = 130;
  let playerStartX = centerX - ((playerSize - 1) * playerCardGap) / 2 - 55;
  for (let i = 0; i < playerSize; i++) {
    let x = playerStartX + i * playerCardGap;
    let y = 770;
    if (mX >= x && mX <= x + 110 && mY >= y && mY <= y + 150) {
      if (selectedCardIndex === -1) {
        selectedCardIndex = i;
        statusMessage = "Selected card rank " + playerHand[i].getRankStr() + ".";
      } else if (selectedCardIndex === i) {
        selectedCardIndex = -1;
        statusMessage = "Deselected card.";
      } else {
        let c1 = playerHand[selectedCardIndex];
        let c2 = playerHand[i];
        let topOpen = openSize > 0 ? openPile[openSize - 1] : null;

        let isSameValue = (c1.value === c2.value);
        let isSum = (topOpen !== null && (c1.value + c2.value === topOpen.value));
        let isDiff = (topOpen !== null && (Math.abs(c1.value - c2.value) === topOpen.value));

        if (isSameValue || isSum || isDiff) {
          if (isSum) {
            animCards = c1.value >= c2.value ? [c2, c1] : [c1, c2];
          } else if (isDiff) {
            animCards = c1.value >= c2.value ? [c1, c2] : [c2, c1];
          } else {
            let high = Math.max(selectedCardIndex, i);
            let low = Math.min(selectedCardIndex, i);
            animCards = [playerHand[high], playerHand[low]];
          }

          animCardCount = 2;
          animatingPlay = true;
          animStartTime = millis();
          pendingAITurn = true;

          let high = Math.max(selectedCardIndex, i);
          let low = Math.min(selectedCardIndex, i);
          playerHand.splice(high, 1);
          playerHand.splice(low, 1);
          playerSize -= 2;

          selectedCardIndex = -1;
          statusMessage = "Move played!";
        } else {
          statusMessage = "Invalid 2-card combination.";
          selectedCardIndex = -1;
        }
      }
    }
  }

  // Click Call It Button
  let btnW = 180;
  let btnH = 50;
  let btnX = centerX - btnW / 2;
  let btnY = 1005;

  if (mX >= btnX && mX <= btnX + btnW && mY >= btnY && mY <= btnY + btnH) {
    if (playerSize === 1 && playerHand[0].value <= 5) {
      handlePlayerCallIt();
    }
  }
}

function startAITurn() {
  waitingForAI = true;
  aiTurnTime = millis() + 1500;
}

function executeAITurn() {
  if (opponentSize <= 0) return;

  // Check if AI can call it
  if (opponentSize === 1 && opponentHand[0].value <= 5) {
    let shouldCall = true;

    if (knownPlayerCardValue !== null && opponentHand[0].value >= knownPlayerCardValue) {
      shouldCall = false;
    }

    if (shouldCall) {
      executeAICallIt();
      return;
    }
  }

  let topOpen = openSize > 0 ? openPile[openSize - 1] : null;

  // AI Sum
  if (topOpen !== null) {
    for (let i = 0; i < opponentSize; i++) {
      for (let j = i + 1; j < opponentSize; j++) {
        let v1 = opponentHand[i].value;
        let v2 = opponentHand[j].value;
        if (v1 + v2 === topOpen.value) {
          animCards = v1 >= v2 ? [opponentHand[j], opponentHand[i]] : [opponentHand[i], opponentHand[j]];
          animCardCount = 2;
          animatingPlay = true;
          animStartTime = millis();
          pendingAITurn = false;
          isPlayerTurn = true;
          removeOpponentCards(j, i);
          statusMessage = "Opponent matched open card (Sum). Your turn.";
          return;
        }
      }
    }
  }

  // AI Difference
  if (topOpen !== null) {
    for (let i = 0; i < opponentSize; i++) {
      for (let j = i + 1; j < opponentSize; j++) {
        let v1 = opponentHand[i].value;
        let v2 = opponentHand[j].value;
        if (Math.abs(v1 - v2) === topOpen.value) {
          animCards = v1 >= v2 ? [opponentHand[i], opponentHand[j]] : [opponentHand[j], opponentHand[i]];
          animCardCount = 2;
          animatingPlay = true;
          animStartTime = millis();
          pendingAITurn = false;
          isPlayerTurn = true;
          removeOpponentCards(j, i);
          statusMessage = "Opponent matched open card (Diff). Your turn.";
          return;
        }
      }
    }
  }

  // AI Pair
  for (let i = 0; i < opponentSize; i++) {
    for (let j = i + 1; j < opponentSize; j++) {
      if (opponentHand[i].value === opponentHand[j].value) {
        animCards = [opponentHand[j], opponentHand[i]];
        animCardCount = 2;
        animatingPlay = true;
        animStartTime = millis();
        pendingAITurn = false;
        isPlayerTurn = true;
        removeOpponentCards(j, i);
        statusMessage = "Opponent played a pair. Your turn.";
        return;
      }
    }
  }

  // AI Exchange Logic for Pair
  if (topOpen !== null && openSize > 0) {
    let valueCounts = {};
    for (let c of opponentHand) {
      valueCounts[c.value] = (valueCounts[c.value] || 0) + 1;
    }

    let hasSingleOfOpen = (valueCounts[topOpen.value] === 1);

    if (hasSingleOfOpen) {
      let candidateIndices = [];
      for (let i = 0; i < opponentSize; i++) {
        let val = opponentHand[i].value;
        if (val > 5) {
          let count = valueCounts[val];
          if (count !== 2) {
            candidateIndices.push(i);
          }
        }
      }

      if (candidateIndices.length > 0) {
        let bestIdx = candidateIndices[0];
        for (let idx of candidateIndices) {
          if (opponentHand[idx].value > opponentHand[bestIdx].value) {
            bestIdx = idx;
          }
        }

        openSize--;
        animCards = [opponentHand[bestIdx]];
        animCardCount = 1;
        animatingPlay = true;
        animStartTime = millis();
        pendingAITurn = false;
        isPlayerTurn = true;
        opponentHand[bestIdx] = topOpen;
        statusMessage = "Opponent took open card. Your turn.";
        return;
      }
    }
  }

  // AI Blind Draw / Regular Turn
  if (deckSize > 0) {
    let valueCounts = {};
    for (let c of opponentHand) {
      valueCounts[c.value] = (valueCounts[c.value] || 0) + 1;
    }

    let candidateIndices = [];
    for (let i = 0; i < opponentSize; i++) {
      let val = opponentHand[i].value;
      if (val > 5 && valueCounts[val] !== 2) {
        candidateIndices.push(i);
      }
    }

    let targetIdx = 0;
    if (candidateIndices.length > 0) {
      targetIdx = candidateIndices[0];
      for (let idx of candidateIndices) {
        if (opponentHand[idx].value > opponentHand[targetIdx].value) {
          targetIdx = idx;
        }
      }
    } else {
      for (let i = 1; i < opponentSize; i++) {
        if (opponentHand[i].value > opponentHand[targetIdx].value) {
          targetIdx = i;
        }
      }
    }

    animCards = [opponentHand[targetIdx]];
    animCardCount = 1;
    animatingPlay = true;
    animStartTime = millis();
    pendingAITurn = false;
    isPlayerTurn = true;
    opponentHand[targetIdx] = deck.pop();
    deckSize--;
    statusMessage = "Opponent drew blind. Your turn.";
    return;
  }
}

function removeOpponentCards(high, low) {
  let h = Math.max(high, low);
  let l = Math.min(high, low);
  opponentHand.splice(h, 1);
  opponentHand.splice(l, 1);
  opponentSize -= 2;
}

function handlePlayerCallIt() {
  let opponentSum = opponentHand.reduce((sum, c) => sum + c.value, 0);
  let playerCardVal = playerHand[0].value;

  revealOpponentCards = true;
  if (opponentSum > playerCardVal) {
    statusMessage = "You won round! Press Continue.";
    opponentScore += opponentSum;
  } else {
    statusMessage = "Lost round call! Press Continue.";
    playerScore += playerCardVal + 10;
  }
  callItGameOverPaused = true;
}

function executeAICallIt() {
  let playerSum = playerHand.reduce((sum, c) => sum + c.value, 0);
  let aiCardVal = opponentHand[0].value;

  revealOpponentCards = true;
  if (playerSum > aiCardVal) {
    statusMessage = "Opponent called it and lost! Press Continue.";
    playerScore += playerSum;
  } else {
    statusMessage = "Opponent called it and won! Press Continue.";
    opponentScore += aiCardVal + 10;
  }
  callItGameOverPaused = true;
}
</script>

</body>
